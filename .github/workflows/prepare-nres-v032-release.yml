name: Prepare N RES v0.3.2 release for in-plugin downloads
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/prepare-nres-v032-release.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  create_release_draft:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Prepare draft release without exposing unverified installers
        shell: bash
        run: |
          set -euo pipefail
          TAG=nres-v0.3.2
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists."
            exit 0
          fi
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
            --target main --draft --title "N RES v0.3.2" \
            --notes "N RES v0.3.2 — Five-point spectral resonance DSP interaction fixes and in-plugin download improvements. Includes macOS Universal VST3/AU and Windows x64 VST3. Both packages are unsigned development installers; close the DAW before installing. Upload the two N RES installers and publish only after checking them."
          echo "Draft created. Add the macOS .pkg and Windows .exe assets, then Publish release to activate the updater in existing N RES 0.3.1 installations."
