name: Publish verified Nativos Soft Clipper 2.7.1 binaries
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ship-verified-softclipper-v271.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  ship:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      MAC_ARTIFACT_URL: 'https://sdmntprcentralus.oaiusercontent.com/files/00000000-804c-81f5-9e27-de09cbf1a4c3/raw?se=2026-10-23T23%3A12%3A08Z&sp=r&sv=2026-02-06&sr=b&scid=df41f3b0-ba5a-5b9e-90b4-170e66aa3a06&skoid=2757bbe4-5137-4324-975b-acedc0bad279&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-23T12%3A13%3A28Z&ske=2026-10-24T12%3A13%3A28Z&sks=b&skv=2026-02-06&sig=4uAPCq9IaDJSmFV9NhjzqnFSg9K0pPyFk5JQgyekXW4%3D'
      WIN_ARTIFACT_URL: 'https://sdmntprcentralus.oaiusercontent.com/files/00000000-be70-81f5-a9c3-d1c8b461c78a/raw?se=2026-10-23T23%3A12%3A04Z&sp=r&sv=2026-02-06&sr=b&scid=bcdb296d-10d6-51ba-83e5-d1112ea6eb8e&skoid=2757bbe4-5137-4324-975b-acedc0bad279&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-23T04%3A41%3A53Z&ske=2026-10-24T04%3A41%3A53Z&sks=b&skv=2026-02-06&sig=H0wOLzvFO2bddn1sDADVq6MlwWspe79o6yEkx3yfGvM%3D'
    steps:
      - name: Fetch and verify GitHub-built macOS and Windows artifacts
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --max-time 150 "$MAC_ARTIFACT_URL" -o mac.zip
          curl -fsSL --retry 3 --max-time 150 "$WIN_ARTIFACT_URL" -o win.zip
          echo '1d886812b02f31935e57b6099c1c5e63f295d5583c971ef8cb4be120d5b4f468  mac.zip' | sha256sum -c -
          echo '0614ea4f30e80cc3bbd880325ba724ddb9847e5ce2994f1d66d1e01d678ce10d  win.zip' | sha256sum -c -
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          for zipname,ext,target in (
              ('mac.zip','.pkg','NativosSoftClipper-v2.7.1-macOS-Unsigned.pkg'),
              ('win.zip','.exe','NativosSoftClipper-v2.7.1-Windows-Unsigned-Setup.exe')):
              with ZipFile(zipname) as z:
                  files=[i for i in z.infolist() if i.filename.endswith(ext) and not i.is_dir()]
                  if len(files)!=1: raise SystemExit(f'Expected one {ext} installer')
                  data=z.read(files[0])
                  if len(data)<1000000: raise SystemExit('Unexpectedly small installer')
                  Path(target).write_bytes(data)
          PY
      - name: Upload approved installers to existing GitHub draft
        shell: bash
        run: |
          set -euo pipefail
          gh release upload v2.7.1 'NativosSoftClipper-v2.7.1-macOS-Unsigned.pkg' 'NativosSoftClipper-v2.7.1-Windows-Unsigned-Setup.exe' --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit v2.7.1 --repo "$GITHUB_REPOSITORY" --draft=false --prerelease=false
      - name: Write stable update feed with verified SHA-256
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json,os
          from pathlib import Path
          base='https://github.com/'+os.environ['GITHUB_REPOSITORY']+'/releases/download/v2.7.1/'
          def asset(name):
              data=Path(name).read_bytes()
              return {'url':base+name,'sha256':hashlib.sha256(data).hexdigest()}
          manifest={'schema':1,'product':'nativos-softclipper','channel':'stable','version':'2.7.1',
            'notes':['Threshold is now called Soft Clip; Input Gain is now called Drive.',
                     'Meter speed choices Fast, Medium, Slow (Slow default).',
                     'Switch between dBFS sample peaks and K-weighted stereo LUFS (3s short-term or 400ms momentary).',
                     'Optional 1.5-second peak hold; no changes to the original clipping DSP or artwork.',
                     'Close DAW before installing; installers are unsigned.'],
            'macos':asset('NativosSoftClipper-v2.7.1-macOS-Unsigned.pkg'),
            'windows':asset('NativosSoftClipper-v2.7.1-Windows-Unsigned-Setup.exe')}
          Path('stable.json').write_text(json.dumps(manifest,indent=2)+'\n')
          PY
          existing="$(gh api "repos/$GITHUB_REPOSITORY/contents/updates/softclipper/stable.json" --jq '.sha')"
          encoded="$(base64 -w0 stable.json)"
          gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/updates/softclipper/stable.json" -f "message=Release Nativos Soft Clipper 2.7.1" -f "content=$encoded" -f "branch=main" -f "sha=$existing" >/dev/null
          echo "Nativos Soft Clipper 2.7.1 update feed live."
