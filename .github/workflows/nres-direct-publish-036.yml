name: Publish verified N RES 0.3.6 installers to in-plugin updates

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/nres-direct-publish-036.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: nres-v0.3.6
      VERSION: "0.3.6"
      SOURCE_COMMIT: "8f4c615f15ff32c48ff30867407ab04c8f703051"
      MAC_ZIP_URL: "https://sdmntprcentralus.oaiusercontent.com/files/00000000-9854-81f5-98cc-6a485d07673a/raw?se=2026-11-05T22%3A44%3A04Z&sp=r&sv=2026-02-06&sr=b&scid=7bf7b7a7-1887-5b1b-be6d-bba5d9bf424d&skoid=d1cabc79-3240-4866-94fe-6005330cb49e&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-05T13%3A49%3A25Z&ske=2026-11-06T13%3A49%3A25Z&sks=b&skv=2026-02-06&sig=q7ABEP9Xm5ZrIs2jgNjumLGg363dxPoV68hQY21zBlM%3D"
      WIN_ZIP_URL: "https://sdmntprcentralus.oaiusercontent.com/files/00000000-2a8c-81f5-95bc-1aaa66fcccae/raw?se=2026-11-05T22%3A44%3A04Z&sp=r&sv=2026-02-06&sr=b&scid=463306f7-8d0d-5a80-9c62-fb4a61704139&skoid=d1cabc79-3240-4866-94fe-6005330cb49e&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-05T11%3A03%3A37Z&ske=2026-11-06T11%3A03%3A37Z&sks=b&skv=2026-02-06&sig=q0rEaLlQMn9c5teEJ/8TfTqqq0R6lB43drZJGOrR1lo%3D"
      MAC_ZIP_SHA256: "08e7408855ab7a9554e586fc3a57c586177c222550384fe1e089b6ca76cb85fe"
      WIN_ZIP_SHA256: "aafeb4993615b41b905921921ba02a007f0e15171ce4bb29f81fecff0cfea3e8"
      MAC_NAME: N-RES-0.3.6-macOS-Universal-UNSIGNED.pkg
      WIN_NAME: N-RES-0.3.6-Windows-x64-UNSIGNED.exe
      MAC_FILE_SHA256: "ad4f9095b30d82b339a64d1c5862e645184725a79b8ff9427ad0d602a318973e"
      WIN_FILE_SHA256: "7ac15345702d5bdbf5a5f4f8cb0f24ed545a018dda0f77d7144f310dab46a041"
    steps:
      - uses: actions/checkout@v4
      - name: Download the exact build artifacts and confirm GitHub-produced hashes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p packages verified
          curl --fail --location --retry 2 --retry-delay 2 --silent --show-error "$MAC_ZIP_URL" -o packages/mac.zip
          curl --fail --location --retry 2 --retry-delay 2 --silent --show-error "$WIN_ZIP_URL" -o packages/windows.zip
          echo "$MAC_ZIP_SHA256  packages/mac.zip" | sha256sum -c -
          echo "$WIN_ZIP_SHA256  packages/windows.zip" | sha256sum -c -
          unzip -p packages/mac.zip "$MAC_NAME" > "packages/$MAC_NAME"
          unzip -p packages/windows.zip "$WIN_NAME" > "packages/$WIN_NAME"
          echo "$MAC_FILE_SHA256  packages/$MAC_NAME" | sha256sum -c -
          echo "$WIN_FILE_SHA256  packages/$WIN_NAME" | sha256sum -c -
          test "$(stat -c%s "packages/$MAC_NAME")" -gt 10000000
          test "$(stat -c%s "packages/$WIN_NAME")" -gt 2500000
      - name: Publish both binaries to a public release
        shell: bash
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target main --draft \
              --title "N RES v$VERSION — Nativos Audio" \
              --notes "N RES v0.3.6 includes band Delta audition, stereo focus, smooth bypass, Wet Trim, and A/B session persistence. Mac VST3/AU Universal and Windows VST3 x64 packages passed automated tests. These packages are UNSIGNED development builds and must be tested in Ableton before retail distribution."
          fi
          gh release upload "$TAG" "packages/$MAC_NAME" "packages/$WIN_NAME" --repo "$GITHUB_REPOSITORY" --clobber
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "$MAC_NAME" --dir verified
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "$WIN_NAME" --dir verified
          cmp "packages/$MAC_NAME" "verified/$MAC_NAME"
          cmp "packages/$WIN_NAME" "verified/$WIN_NAME"
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false
      - name: Activate SHA-256-verified update feed for existing N RES installations
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          version=os.environ["VERSION"]
          root="https://github.com/"+os.environ["GITHUB_REPOSITORY"]+"/releases/download/"+os.environ["TAG"]+"/"
          def asset(env):
              name=os.environ[env]
              p=Path("packages")/name
              return {"url":root+name,"sha256":hashlib.sha256(p.read_bytes()).hexdigest()}
          feed={
              "schema":1, "product":"nres", "channel":"stable",
              "published":True, "version":version,
              "notes":[
                  "N RES 0.3.6: real-time resonance reduction display, separate depth curve, 100% Depth point control, and editable band inspector.",
                  "Includes compatible user presets and A/B state persistence; approved Nativos Audio black/yellow UI.",
                  "Development installers are unsigned. Close your DAW before running the installer."
              ],
              "macos":asset("MAC_NAME"), "windows":asset("WIN_NAME")
          }
          path=Path("updates/nres/stable.json")
          path.parent.mkdir(parents=True,exist_ok=True)
          path.write_text(json.dumps(feed,indent=2)+"\n")
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add updates/nres/stable.json
          if git diff --cached --quiet; then
            echo "N RES update feed already current."
          else
            git commit -m "Publish SHA256-verified N RES v0.3.6 in-plugin installers"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
