name: Verify X2 Public Download Feed
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify both public v0.9.8 installers exist
        shell: bash
        run: |
          set -euo pipefail
          gh release view x2-v0.9.8 --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' > /tmp/x2-assets.txt
          grep -Fxq 'X2-Compressor-Nativos-Music-Audio-v0.9.8-macOS-UNSIGNED.pkg' /tmp/x2-assets.txt
          grep -Fxq 'X2-Compressor-Nativos-Music-Audio-v0.9.8-Windows-x64-Setup.exe' /tmp/x2-assets.txt
          python3 - <<'PY'
          import json,pathlib
          feed=json.loads(pathlib.Path("updates/x2/stable.json").read_text())
          assert feed["product"]=="x2-compressor"
          assert feed["published"] is True and feed["version"]=="0.9.8"
          for key,suffix in (("macos",".pkg"),("windows",".exe")):
              assert feed[key]["url"].startswith("https://github.com/tolynativo/nativos-audio-updates/releases/download/x2-v0.9.8/")
              assert feed[key]["url"].endswith(suffix)
              assert len(feed[key]["sha256"])==64
          print("Verified X2 v0.9.8 published update manifest and release entries.")
          PY
