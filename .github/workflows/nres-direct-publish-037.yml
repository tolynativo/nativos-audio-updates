name: Publish verified N RES 0.3.7 installers to in-plugin updates

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/nres-direct-publish-037.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: nres-v0.3.7
      VERSION: "0.3.7"
      SOURCE_COMMIT: "424e9a2fe1196579110b0e03031fba110e7b4cad"
      MAC_ZIP_URL: "https://sdmntprcentralus.oaiusercontent.com/files/00000000-4ee8-81f5-aabc-e5dc3b272c14/raw?se=2026-11-06T00%3A03%3A58Z&sp=r&sv=2026-02-06&sr=b&scid=c9ec5fd4-7c38-5472-a092-39701fe2ba44&skoid=d1cabc79-3240-4866-94fe-6005330cb49e&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-05T13%3A49%3A25Z&ske=2026-11-06T13%3A49%3A25Z&sks=b&skv=2026-02-06&sig=P%2BWG57Gahzlt2UxSJZ4C1yOZDWAB6qZEo5g4qCDrjvE%3D"
      WIN_ZIP_URL: "https://sdmntprcentralus.oaiusercontent.com/files/00000000-020c-81f5-ad30-9994fb338c86/raw?se=2026-11-06T00%3A03%3A58Z&sp=r&sv=2026-02-06&sr=b&scid=3fc255c4-9482-5716-b261-39e124a9d163&skoid=d1cabc79-3240-4866-94fe-6005330cb49e&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-05T11%3A03%3A37Z&ske=2026-11-06T11%3A03%3A37Z&sks=b&skv=2026-02-06&sig=T6N73ssueHW5BoONhtFDxOwe1XQI4KkWjebp9UtkVdo%3D"
      MAC_ZIP_SHA256: "1fc4450e4f943ef8d8d28b92636ac4911279bef7cbbb4867f2056db68cfea040"
      WIN_ZIP_SHA256: "7fb79bab8703b5f53788daa1d506218beee51757596d3f51a35f77a860d251ed"
      MAC_NAME: N-RES-0.3.7-macOS-Universal-UNSIGNED.pkg
      WIN_NAME: N-RES-0.3.7-Windows-x64-UNSIGNED.exe
      MAC_FILE_SHA256: "0cedb5f084241c6d86ae9a75a6884907db57c0be24ee1324165cf22bb1185217"
      WIN_FILE_SHA256: "e0aa4be87faa860c0ed15c140751d35d41bf6fc26ab57c1fc6c9c695c26e107c"
    steps:
      - uses: actions/checkout@v4
      - name: Download the exact build artifacts and confirm GitHub-produced hashes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p packages verified
          curl --fail --location --retry 2 --retry-delay 2 --silent --show-error "$MAC_ZIP_URL" -o packages/mac.zip
          curl --fail --location --retry 2 --retry-delay 2 --silent --show-error "$WIN_ZIP_URL" -o packages/windows.zip
          echo "$MAC_ZIP_SHA256  packages/mac.zip" | sha256sum -c -
          echo "$WIN_ZIP_SHA256  packages/windows.zip" | sha256sum -c -
          unzip -p packages/mac.zip "$MAC_NAME" > "packages/$MAC_NAME"
          unzip -p packages/windows.zip "$WIN_NAME" > "packages/$WIN_NAME"
          echo "$MAC_FILE_SHA256  packages/$MAC_NAME" | sha256sum -c -
          echo "$WIN_FILE_SHA256  packages/$WIN_NAME" | sha256sum -c -
          test "$(stat -c%s "packages/$MAC_NAME")" -gt 10000000
          test "$(stat -c%s "packages/$WIN_NAME")" -gt 2500000
      - name: Publish both binaries to a public release
        shell: bash
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target main --draft \
              --title "N RES v$VERSION — Nativos Audio" \
              --notes "N RES v0.3.7 adds 95 original categorized factory presets, favorites, saved user preset browsing, and the simplified Depth/Detail/Attack/Release four-knob UI while preserving existing DSP, stereo, Delta and A/B. Mac VST3/AU Universal and Windows VST3 x64 packages passed automated tests. These packages are UNSIGNED development builds and must be tested in Ableton before retail distribution."
          fi
          gh release upload "$TAG" "packages/$MAC_NAME" "packages/$WIN_NAME" --repo "$GITHUB_REPOSITORY" --clobber
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "$MAC_NAME" --dir verified
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "$WIN_NAME" --dir verified
          cmp "packages/$MAC_NAME" "verified/$MAC_NAME"
          cmp "packages/$WIN_NAME" "verified/$WIN_NAME"
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false
      - name: Activate SHA-256-verified update feed for existing N RES installations
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          version=os.environ["VERSION"]
          root="https://github.com/"+os.environ["GITHUB_REPOSITORY"]+"/releases/download/"+os.environ["TAG"]+"/"
          def asset(env):
              name=os.environ[env]
              p=Path("packages")/name
              return {"url":root+name,"sha256":hashlib.sha256(p.read_bytes()).hexdigest()}
          feed={
              "schema":1, "product":"nres", "channel":"stable",
              "published":True, "version":version,
              "notes":[
                  "N RES 0.3.7: 95 original factory presets, a category and favorites browser, saved preset navigation and a simplified four-knob UI.",
                  "Four main controls: Depth, Detail, Attack and Release. Saved user presets, A/B and black/yellow branding remain compatible.",
                  "Development installers are unsigned. Close your DAW before running the installer."
              ],
              "macos":asset("MAC_NAME"), "windows":asset("WIN_NAME")
          }
          path=Path("updates/nres/stable.json")
          path.parent.mkdir(parents=True,exist_ok=True)
          path.write_text(json.dumps(feed,indent=2)+"\n")
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add updates/nres/stable.json
          if git diff --cached --quiet; then
            echo "N RES update feed already current."
          else
            git commit -m "Publish SHA256-verified N RES v0.3.7 in-plugin installers"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
